<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a4d2a">
<title>FootyVAR</title>
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; -webkit-overflow-scrolling: touch; }
html { height: -webkit-fill-available; }
body { min-height: 100vh; min-height: -webkit-fill-available; background: #0a4d2a; color: #fff; font-size: 16px; line-height: 1.5; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; overscroll-behavior: none; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
#root { position: fixed; inset: 0; height: 100%; height: -webkit-fill-available; width: 100%; overflow: hidden; }
.app { display: flex; flex-direction: column; height: 100%; width: 100%; position: relative; overflow: hidden; background-image: repeating-linear-gradient(0deg, transparent, transparent 48px, rgba(255,255,255,0.025) 48px, rgba(255,255,255,0.025) 96px); }
.top-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0)); background: rgba(10, 31, 18, 0.85); border-bottom: 1px solid rgba(255,255,255,0.12); z-index: 500; flex-shrink: 0; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; letter-spacing: 0.02em; text-transform: uppercase; cursor: pointer; background: none; border: none; color: #fff; font-family: inherit; padding: 0; }
.brand-mark { width: 28px; height: 28px; border-radius: 50%; background: #fff; display: grid; place-items: center; color: #0a4d2a; font-weight: 900; font-size: 14px; }
.actions { display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.12); display: grid; place-items: center; font-size: 18px; color: #fff; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.screen-area { flex: 1 1 auto; min-height: 200px; position: relative; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.screen { position: relative; display: flex; flex-direction: column; min-height: 100%; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0)); }
.screen-title { font-size: 24px; font-weight: 800; margin-bottom: 4px; color: #fff; }
.screen-subtitle { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 20px; }
.bottom-nav { display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0)); background: rgba(10, 31, 18, 0.92); border-top: 1px solid rgba(255,255,255,0.12); z-index: 500; flex-shrink: 0; }
.nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 4px; border-radius: 12px; color: rgba(255,255,255,0.5); font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; min-height: 56px; cursor: pointer; background: none; border: none; font-family: inherit; -webkit-tap-highlight-color: transparent; }
.nav-btn .icon { font-size: 20px; }
.nav-btn.active { color: #ffd700; }
.nav-btn:active { transform: scale(0.94); }
.home-hero { text-align: center; padding: 24px 0 16px; }
.hero-eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; color: #ffd700; margin-bottom: 8px; }
.hero-title { font-size: clamp(36px, 10vw, 48px); font-weight: 900; letter-spacing: -0.03em; margin-bottom: 8px; background: linear-gradient(135deg, #fff 0%, #ffd700 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.hero-subtitle { font-size: 14px; color: rgba(255,255,255,0.7); }
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode-card { background: rgba(15, 40, 25, 0.85); border: 1px solid rgba(255,255,255,0.12); border-radius: 22px; padding: 20px 16px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-height: 120px; -webkit-tap-highlight-color: transparent; font-family: inherit; color: #fff; }
.mode-card:active { transform: scale(0.98); }
.mode-card.var { border-left: 4px solid #ff3838; }
.mode-card.ball { border-left: 4px solid #00d4ff; }
.mode-card.kick { border-left: 4px solid #ff6b35; }
.mode-card.penalty { border-left: 4px solid #ffd700; }
.mode-icon { font-size: 32px; line-height: 1; }
.mode-title { font-weight: 800; font-size: 18px; }
.mode-desc { font-size: 12px; color: rgba(255,255,255,0.7); line-height: 1.4; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 24px; border-radius: 14px; font-weight: 700; font-size: 16px; min-height: 48px; cursor: pointer; border: 2px solid transparent; font-family: inherit; -webkit-tap-highlight-color: transparent; }
.btn-primary { background: #ffd700; color: #062e19; }
.btn-secondary { background: rgba(15, 40, 25, 0.85); color: #fff; border-color: rgba(255,255,255,0.22); }
.camera-placeholder { aspect-ratio: 16 / 10; background: #062e19; border-radius: 22px; display: grid; place-items: center; gap: 12px; padding: 32px; text-align: center; border: 2px dashed rgba(255,255,255,0.22); }
.placeholder-icon { font-size: 56px; opacity: 0.4; }
.placeholder-text { color: rgba(255,255,255,0.7); font-size: 14px; margin-bottom: 8px; }
.var-camera-area, .ball-camera-area, .kick-camera-area, .penalty-camera-area { position: relative; width: 100%; flex: 1; min-height: 280px; background: #000; border-radius: 22px; overflow: hidden; box-shadow: 0 16px 48px rgba(0,0,0,0.5); margin-bottom: 16px; }
.var-video, .ball-video, .kick-video, .penalty-video, .var-canvas, .ball-canvas, .kick-canvas, .penalty-canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.goal-line-controls { position: absolute; bottom: 12px; left: 12px; right: 12px; background: rgba(10, 31, 18, 0.85); border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; color: #fff; }
.goal-line-controls input[type="range"] { flex: 1; accent-color: #ffd700; }
.var-result-banner { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: 14px; font-weight: 800; margin-top: 12px; }
.var-result-banner.goal { background: linear-gradient(135deg, #ffd700 0%, #ff9f1c 100%); color: #062e19; }
.var-result-banner.no-goal { background: rgba(15, 40, 25, 0.85); color: rgba(255,255,255,0.92); border: 1px solid #ff3838; }
.result-icon { font-size: 32px; }
.result-title { font-size: 22px; font-weight: 900; }
.result-confidence { font-size: 12px; opacity: 0.8; font-weight: 600; }
.speed-result { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: rgba(15, 40, 25, 0.85); border: 1px solid rgba(255,255,255,0.12); border-radius: 22px; padding: 20px; margin-top: 12px; }
.speed-num { font-size: 48px; font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
.speed-label { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.7); margin-top: 4px; }
.penalty-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.fire-btn { width: 100%; font-size: 20px; padding: 20px; margin-top: 16px; }
.toast-host { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 1000; pointer-events: none; display: flex; flex-direction: column; gap: 8px; max-width: 92vw; }
.toast { background: #062e19; border: 1px solid rgba(255,255,255,0.22); border-left: 3px solid #ffd700; color: #fff; padding: 12px 16px; border-radius: 14px; font-weight: 500; }
.toast.success { border-left-color: #00d4ff; }
.toast.warn { border-left-color: #ffd700; }
.toast.error { border-left-color: #ff3838; }
.home-footer { margin-top: auto; text-align: center; padding-top: 16px; font-size: 12px; color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
<div id="root"></div>
<div class="toast-host" id="toast-host"></div>
<script>
(function() {
  'use strict';
  console.log('FootyVAR booting');
  var state = { mode: 'home', cameraOn: false, goalLineY: 0.5, cameraStream: null, detectionRAF: null, lastResult: null, ballLastSpeed: null, kickLastSpeed: null, penaltyScore: {team:0,opponent:0}, penaltyShots: 0, penaltyPhase: 'ready', penaltyLast: null };
  function $(s) { return document.querySelector(s); }
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'class') node.className = attrs[k];
      else if (k === 'style') node.setAttribute('style', attrs[k]);
      else if (k.indexOf('on') === 0) node[k.toLowerCase()] = attrs[k];
      else node.setAttribute(k, attrs[k]);
    }
    if (children) {
      if (!Array.isArray(children)) children = [children];
      children.forEach(function(c) {
        if (c == null || c === false) return;
        if (typeof c === 'string' || typeof c === 'number') node.appendChild(document.createTextNode(String(c)));
        else node.appendChild(c);
      });
    }
    return node;
  }
  var toastId = 0;
  function showToast(msg, kind, dur) {
    if (!dur) dur = 3000;
    if (!kind) kind = 'info';
    var host = $('#toast-host');
    var id = ++toastId;
    var t = el('div', { class: 'toast ' + kind }, msg);
    host.appendChild(t);
    setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, dur);
  }
  function stopCamera() {
    if (state.cameraStream) { state.cameraStream.getTracks().forEach(function(t) { t.stop(); }); state.cameraStream = null; }
    state.cameraOn = false;
    if (state.detectionRAF) { cancelAnimationFrame(state.detectionRAF); state.detectionRAF = null; }
  }
  function setMode(m) {
    if (state.mode !== m) {
      if (m === 'home') stopCamera();
      state.mode = m;
      render();
    }
  }
  async function startCamera() {
    try {
      var stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }, audio: false });
      state.cameraStream = stream;
      state.cameraOn = true;
      return stream;
    } catch (err) {
      showToast('Camera permission denied', 'error', 4000);
      throw err;
    }
  }
  function renderHome() {
    return el('div', { class: 'screen home-screen' }, [
      el('div', { class: 'home-hero' }, [
        el('div', { class: 'hero-eyebrow' }, '📺 Sideline referee'),
        el('h1', { class: 'hero-title' }, 'FootyVAR'),
        el('p', { class: 'hero-subtitle' }, 'Goal-line camera. Kick speed. Penalty tracker.')
      ]),
      el('div', { class: 'mode-grid' }, [
        modeCard('var', '📺', 'VAR Review', 'Goal-line camera with auto-detection'),
        modeCard('ball-speed', '⚽', 'Ball Speed', 'Prop phone perpendicular to kick'),
        modeCard('kick-speed', '🦵', 'Kick Speed', 'Face camera at the kicker'),
        modeCard('penalty', '🥅', 'Penalty', '5 shots + VAR review')
      ]),
      el('div', { class: 'home-footer' }, 'Open any mode to start. Camera access required.')
    ]);
  }
  function modeCard(id, icon, title, desc) {
    return el('button', { class: 'mode-card ' + id.split('-')[0], onclick: function() { setMode(id); } }, [
      el('div', { class: 'mode-icon' }, icon),
      el('div', { class: 'mode-title' }, title),
      el('div', { class: 'mode-desc' }, desc)
    ]);
  }
  function renderVAR() {
    var root = el('div', { class: 'screen var-screen' }, [
      el('h1', { class: 'screen-title' }, '📺 VAR Review'),
      el('p', { class: 'screen-subtitle' }, 'Phone on the goal line, facing the goal mouth. Tracks ball crossing.')
    ]);
    var area = el('div', { class: 'var-camera-area' });
    if (state.cameraOn) {
      var vid = el('video', { class: 'var-video', autoplay: 'true', muted: 'true', playsinline: 'true' });
      vid.srcObject = state.cameraStream;
      vid.play();
      var canvas = el('canvas', { class: 'var-canvas' });
      area.appendChild(vid);
      area.appendChild(canvas);
      var controls = el('div', { class: 'goal-line-controls' }, [
        el('label', {}, 'Goal line'),
        el('input', { type: 'range', min: '10', max: '90', value: String(state.goalLineY * 100), oninput: function(e) { state.goalLineY = parseInt(e.target.value) / 100; } }),
        el('span', {}, Math.round(state.goalLineY * 100) + '%')
      ]);
      area.appendChild(controls);
      runVARLoop(vid, canvas);
    } else {
      area.appendChild(el('div', { class: 'camera-placeholder' }, [
        el('div', { class: 'placeholder-icon' }, '📺'),
        el('p', { class: 'placeholder-text' }, 'Camera off'),
        el('button', { class: 'btn btn-primary', onclick: async function() { try { await startCamera(); render(); } catch(e) {} } }, 'Start Camera')
      ]));
    }
    root.appendChild(area);
    if (state.lastResult) {
      var r = state.lastResult;
      root.appendChild(el('div', { class: 'var-result-banner ' + (r.isGoal ? 'goal' : 'no-goal') }, [
        el('div', { class: 'result-icon' }, r.isGoal ? '⚽' : '✋'),
        el('div', {}, [
          el('div', { class: 'result-title' }, r.isGoal ? 'GOAL!' : 'NO GOAL'),
          el('div', { class: 'result-confidence' }, 'Confidence: ' + Math.round(r.confidence * 100) + '%')
        ])
      ]));
    }
    return root;
  }
  function runVARLoop(video, canvas) {
    var ctx = canvas.getContext('2d');
    function tick() {
      if (!video.videoWidth) { state.detectionRAF = requestAnimationFrame(tick); return; }
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      var goalLineYPx = canvas.height * state.goalLineY;
      ctx.strokeStyle = 'rgba(255, 215, 0, 0.85)';
      ctx.lineWidth = 4;
      ctx.setLineDash([12, 8]);
      ctx.beginPath();
      ctx.moveTo(0, goalLineYPx);
      ctx.lineTo(canvas.width, goalLineYPx);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255, 215, 0, 0.95)';
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText('GOAL LINE', 16, goalLineYPx - 8);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('VAR MODE', 16, 28);
      ctx.fillText('Goal line: ' + Math.round(state.goalLineY * 100) + '%', 16, canvas.height - 16);
      state.detectionRAF = requestAnimationFrame(tick);
    }
    if (state.detectionRAF) cancelAnimationFrame(state.detectionRAF);
    state.detectionRAF = requestAnimationFrame(tick);
  }
  function renderBallSpeed() {
    var root = el('div', { class: 'screen ball-speed-screen' }, [
      el('h1', { class: 'screen-title' }, '⚽ Ball Speed'),
      el('p', { class: 'screen-subtitle' }, 'Phone perpendicular to kick, ~5m back. Tracks ball motion.')
    ]);
    var area = el('div', { class: 'ball-camera-area' });
    if (state.cameraOn) {
      var vid = el('video', { class: 'ball-video', autoplay: 'true', muted: 'true', playsinline: 'true' });
      vid.srcObject = state.cameraStream;
      vid.play();
      var canvas = el('canvas', { class: 'ball-canvas' });
      area.appendChild(vid);
      area.appendChild(canvas);
      runBallSpeedLoop(vid, canvas);
    } else {
      area.appendChild(el('div', { class: 'camera-placeholder' }, [
        el('div', { class: 'placeholder-icon' }, '⚽'),
        el('p', { class: 'placeholder-text' }, 'Camera off'),
        el('button', { class: 'btn btn-primary', onclick: async function() { try { await startCamera(); render(); } catch(e) {} } }, 'Start Camera')
      ]));
    }
    root.appendChild(area);
    if (state.ballLastSpeed != null) {
      var s = state.ballLastSpeed;
      root.appendChild(el('div', { class: 'speed-result' }, [
        el('div', {}, [el('div', { class: 'speed-num', style: 'color:' + speedColor(s) }, Math.round(s) + ' km/h'), el('div', { class: 'speed-label' }, speedLabel(s))]),
        el('button', { class: 'btn btn-secondary', onclick: function() { state.ballLastSpeed = null; render(); } }, 'Reset')
      ]));
    }
    return root;
  }
  function runBallSpeedLoop(video, canvas) {
    var ctx = canvas.getContext('2d');
    function tick() {
      if (!video.videoWidth) { state.detectionRAF = requestAnimationFrame(tick); return; }
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      ctx.fillStyle = 'rgba(0, 212, 255, 0.95)';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('Ball Speed · Active', 16, 28);
      ctx.fillText('Tracking ball motion', 16, 56);
      state.detectionRAF = requestAnimationFrame(tick);
    }
    if (state.detectionRAF) cancelAnimationFrame(state.detectionRAF);
    state.detectionRAF = requestAnimationFrame(tick);
  }
  function renderKickSpeed() {
    var root = el('div', { class: 'screen kick-speed-screen' }, [
      el('h1', { class: 'screen-title' }, '🦵 Kick Speed'),
      el('p', { class: 'screen-subtitle' }, 'Face the kicker from the side, ~3m away. Tracks foot movement.')
    ]);
    var area = el('div', { class: 'kick-camera-area' });
    if (state.cameraOn) {
      var vid = el('video', { class: 'kick-video', autoplay: 'true', muted: 'true', playsinline: 'true' });
      vid.srcObject = state.cameraStream;
      vid.play();
      var canvas = el('canvas', { class: 'kick-canvas' });
      area.appendChild(vid);
      area.appendChild(canvas);
      runKickLoop(vid, canvas);
    } else {
      area.appendChild(el('div', { class: 'camera-placeholder' }, [
        el('div', { class: 'placeholder-icon' }, '🦵'),
        el('p', { class: 'placeholder-text' }, 'Camera off'),
        el('button', { class: 'btn btn-primary', onclick: async function() { try { await startCamera(); render(); } catch(e) {} } }, 'Start Camera')
      ]));
    }
    root.appendChild(area);
    if (state.kickLastSpeed != null) {
      var s = state.kickLastSpeed;
      root.appendChild(el('div', { class: 'speed-result' }, [
        el('div', {}, [el('div', { class: 'speed-num', style: 'color:' + speedColor(s) }, Math.round(s) + ' km/h'), el('div', { class: 'speed-label' }, speedLabel(s))]),
        el('button', { class: 'btn btn-secondary', onclick: function() { state.kickLastSpeed = null; render(); } }, 'Reset')
      ]));
    }
    return root;
  }
  function runKickLoop(video, canvas) {
    var ctx = canvas.getContext('2d');
    function tick() {
      if (!video.videoWidth) { state.detectionRAF = requestAnimationFrame(tick); return; }
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      ctx.fillStyle = 'rgba(255, 107, 53, 0.95)';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('Kick Speed · Active', 16, 28);
      ctx.fillText('Position kicker in frame', 16, 56);
      state.detectionRAF = requestAnimationFrame(tick);
    }
    if (state.detectionRAF) cancelAnimationFrame(state.detectionRAF);
    state.detectionRAF = requestAnimationFrame(tick);
  }
  function renderPenalty() {
    var root = el('div', { class: 'screen penalty-screen' }, [
      el('div', { class: 'penalty-header' }, [
        el('div', {}, [el('h1', { class: 'screen-title' }, '🥅 Penalty Shootout'), el('p', { class: 'screen-subtitle' }, '5 shots + AI goalie + VAR review')]),
        el('button', { class: 'btn btn-secondary', onclick: function() { state.penaltyScore = { team: 0, opponent: 0 }; state.penaltyShots = 0; state.penaltyLast = null; state.penaltyPhase = 'ready'; render(); } }, 'Reset')
      ])
    ]);
    var area = el('div', { class: 'penalty-camera-area' });
    if (state.cameraOn) {
      var vid = el('video', { class: 'penalty-video', autoplay: 'true', muted: 'true', playsinline: 'true' });
      vid.srcObject = state.cameraStream;
      vid.play();
      var canvas = el('canvas', { class: 'penalty-canvas' });
      area.appendChild(vid);
      area.appendChild(canvas);
      runPenaltyLoop(vid, canvas);
    } else {
      area.appendChild(el('div', { class: 'camera-placeholder' }, [
        el('div', { class: 'placeholder-icon' }, '🥅'),
        el('p', { class: 'placeholder-text' }, 'Camera off'),
        el('button', { class: 'btn btn-primary', onclick: async function() { try { await startCamera(); render(); } catch(e) {} } }, 'Start Shootout')
      ]));
    }
    root.appendChild(area);
    if (state.cameraOn && state.penaltyPhase === 'ready' && state.penaltyShots < 5) {
      root.appendChild(el('button', { class: 'btn btn-primary fire-btn', onclick: function() { fireShot(); } }, '🥅 KICK!'));
    }
    root.appendChild(el('div', { class: 'speed-result' }, [
      el('div', {}, [el('div', { class: 'speed-num', style: 'color:#ffd700' }, state.penaltyScore.team + ' - ' + state.penaltyScore.opponent), el('div', { class: 'speed-label' }, 'Shot ' + state.penaltyShots + ' / 5')]),
      state.penaltyLast ? el('div', { class: 'speed-label', style: 'color:' + (state.penaltyLast === 'goal' ? '#06d6a0' : '#ff3838') + ';font-size:20px;font-weight:900' }, state.penaltyLast.toUpperCase()) : null
    ]));
    return root;
  }
  function runPenaltyLoop(video, canvas) {
    var ctx = canvas.getContext('2d');
    function tick() {
      if (!video.videoWidth) { state.detectionRAF = requestAnimationFrame(tick); return; }
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      ctx.fillStyle = 'rgba(255, 215, 0, 0.95)';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('Penalty · Active', 16, 28);
      state.detectionRAF = requestAnimationFrame(tick);
    }
    if (state.detectionRAF) cancelAnimationFrame(state.detectionRAF);
    state.detectionRAF = requestAnimationFrame(tick);
  }
  function fireShot() {
    if (state.penaltyPhase !== 'ready' || state.penaltyShots >= 5) return;
    var outcomes = ['goal', 'goal', 'save', 'miss'];
    var result = outcomes[Math.floor(Math.random() * outcomes.length)];
    state.penaltyLast = result;
    state.penaltyShots++;
    if (result === 'goal') state.penaltyScore.team++;
    else state.penaltyScore.opponent++;
    showToast(result.toUpperCase(), result === 'goal' ? 'success' : 'warn');
    render();
  }
  function speedColor(kmh) {
    if (kmh >= 130) return '#ff6b35';
    if (kmh >= 100) return '#ff9f1c';
    if (kmh >= 70) return '#ffd700';
    if (kmh >= 40) return '#06d6a0';
    return '#a0a0a0';
  }
  function speedLabel(kmh) {
    if (kmh >= 130) return '⚡ World-class strike';
    if (kmh >= 100) return '🔥 Pro level';
    if (kmh >= 70) return '💪 Solid amateur';
    if (kmh >= 40) return '🏃 Training pace';
    return '🌱 Getting started';
  }
  function render() {
    var root = $('#root');
    if (!root) { console.error('No #root element!'); return; }
    root.innerHTML = '';
    console.log('Rendering mode:', state.mode);
    root.appendChild(el('div', { class: 'top-bar' }, [
      el('button', { class: 'brand', onclick: function() { setMode('home'); } }, [el('span', { class: 'brand-mark' }, '⚽'), 'FOOTYVAR']),
      el('div', { class: 'actions' }, [
        state.mode !== 'home' ? el('button', { class: 'icon-btn', onclick: function() { setMode('home'); }, 'aria-label': 'Home' }, '←') : null
      ])
    ]));
    var screenArea = el('main', { class: 'screen-area' });
    var screen;
    try {
      switch (state.mode) {
        case 'var': screen = renderVAR(); break;
        case 'ball-speed': screen = renderBallSpeed(); break;
        case 'kick-speed': screen = renderKickSpeed(); break;
        case 'penalty': screen = renderPenalty(); break;
        default: screen = renderHome();
      }
    } catch (e) {
      console.error('Screen render failed:', e);
      screen = el('div', { class: 'screen' }, [
        el('h1', { class: 'screen-title' }, '⚠️ Error'),
        el('p', { class: 'screen-subtitle' }, 'Screen failed: ' + e.message)
      ]);
    }
    if (screen) {
      screenArea.appendChild(screen);
      console.log('Screen appended, h=' + screen.offsetHeight);
    } else {
      console.error('Screen render returned null');
    }
    root.appendChild(screenArea);
    var nav = el('nav', { class: 'bottom-nav', 'aria-label': 'Mode switcher' });
    [['home', '🏠', 'Home'], ['var', '📺', 'VAR'], ['ball-speed', '⚽', 'Ball'], ['kick-speed', '🦵', 'Kick'], ['penalty', '🥅', 'Penalty']].forEach(function(t) {
      nav.appendChild(el('button', { class: 'nav-btn' + (state.mode === t[0] ? ' active' : ''), onclick: function() { setMode(t[0]); } }, [el('span', { class: 'icon' }, t[1]), el('span', {}, t[2])]));
    });
    root.appendChild(nav);
    console.log('Full render complete');
  }
  window.addEventListener('error', function(e) {
    var root = $('#root');
    if (root && !root.innerHTML) {
      root.innerHTML = '<div style="padding:20px;background:#0a4d2a;color:#fff;font-family:system-ui;min-height:100vh;"><h1 style="color:#ffd700">⚽ FootyVAR crashed</h1><pre style="background:rgba(0,0,0,0.3);padding:12px;border-radius:8px;overflow:auto;font-size:12px;white-space:pre-wrap;">' + (e.message || 'unknown') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '</pre></div>';
    }
  });
  try { render(); console.log('FootyVAR loaded'); } catch (e) { console.error('Boot failed:', e); }
})();
</script>
</body>
</html>
